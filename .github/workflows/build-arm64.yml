name: Build Release ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main-yz
    paths-ignore:
      - '**.md'

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: arm64-v8a
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-arm64
          max-size: 5G
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" --sdk_root=${ANDROID_SDK_ROOT} > /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nagram-arm64-v8a
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error
